name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  tests-sqlite:
    name: Tests (Pest · SQLite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, intl, zip, gd, bcmath, exif, fileinfo, curl, openssl
          coverage: none

      - name: Préparer le fichier d'environnement
        run: cp .env.example .env

      - name: Installer les dépendances Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Générer la clé d'application
        run: php artisan key:generate

      - name: Lancer les tests
        run: php artisan test

  tests-postgres:
    name: Tests (Pest · PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_cfa_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: erp_cfa_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, intl, zip, gd, bcmath, exif, fileinfo, curl, openssl
          coverage: none

      - name: Préparer le fichier d'environnement
        run: cp .env.example .env

      - name: Installer les dépendances Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Générer la clé d'application
        run: php artisan key:generate

      - name: Lancer les tests (sur PostgreSQL)
        # Les variables DB_* du job priment sur le phpunit.xml (SQLite y est
        # déclaré sans force="true", donc PHPUnit ne surcharge pas l'environnement réel).
        run: php artisan test
